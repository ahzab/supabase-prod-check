name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Broken example fails the scan
        run: |
          set +e
          node dist/cli.js examples/broken-app
          test $? -eq 1
      - name: Fixed example passes with --strict
        run: node dist/cli.js examples/fixed-app --strict
